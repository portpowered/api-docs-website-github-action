name: API Docs
description: Generate a static API reference from OpenAPI, AsyncAPI, and GraphQL schemas.
inputs:
  title:
    description: Website title.
    required: false
    default: API Documentation
  openapi:
    description: Comma-separated paths or globs for OpenAPI documents.
    required: false
  asyncapi:
    description: Comma-separated paths or globs for AsyncAPI documents.
    required: false
  graphql:
    description: Comma-separated paths or globs for GraphQL SDL documents.
    required: false
  discover:
    description: Discover supported schemas in the source directory.
    required: false
    default: "true"
  source-directory:
    description: Root directory for schema paths and discovery.
    required: false
    default: .
  guides-directory:
    description: Optional directory of Markdown or MDX guides, relative to source-directory.
    required: false
  base-path:
    description: URL prefix used for GitHub Pages project sites, such as /go-ring. Defaults to the repository name when running on GitHub Actions.
    required: false
    default: ""
  output:
    description: Directory in which to write the static website.
    required: false
    default: api-docs-out
  json-media-types:
    description: Comma-separated additional request media types whose bodies are encoded as JSON. Opt in only when the provider uses JSON with a nonstandard Content-Type.
    required: false
    default: ""
  schema-view:
    description: Native schema tables, or references to render recursive allOf/oneOf contracts without expanding intersections.
    required: false
    default: native
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install generator dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund
    - name: Generate API reference website
      shell: bash
      env:
        API_DOCS_TITLE: ${{ inputs.title }}
        API_DOCS_OPENAPI: ${{ inputs.openapi }}
        API_DOCS_ASYNCAPI: ${{ inputs.asyncapi }}
        API_DOCS_GRAPHQL: ${{ inputs.graphql }}
        API_DOCS_DISCOVER: ${{ inputs.discover }}
        API_DOCS_SOURCE: ${{ inputs.source-directory }}
        API_DOCS_GUIDES: ${{ inputs.guides-directory }}
        API_DOCS_BASE_PATH: ${{ inputs.base-path }}
        API_DOCS_OUTPUT: ${{ inputs.output }}
        API_DOCS_JSON_MEDIA_TYPES: ${{ inputs.json-media-types }}
        API_DOCS_SCHEMA_VIEW: ${{ inputs.schema-view }}
      run: node "${{ github.action_path }}/scripts/build.mjs"
