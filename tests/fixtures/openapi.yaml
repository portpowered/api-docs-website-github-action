openapi: 3.0.3
info:
  title: Sample Library HTTP API
  version: 1.0.0
  description: Synthetic fixture for the documentation build smoke test.
paths:
  /legacy-widgets:
    post:
      operationId: registerLegacyWidget
      summary: Register a widget with a legacy JSON content type
      tags: [Widgets]
      requestBody:
        required: true
        content:
          plain/text:
            schema:
              type: object
              required: [name, enabled]
              properties:
                name: {type: string}
                enabled: {type: boolean}
            example: {name: legacy-widget, enabled: true}
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Widget'}
  /widgets:
    post:
      operationId: logoutWidgetSession
      summary: End a session with parameterized JSON media
      tags: [Widgets]
      requestBody:
        required: true
        content:
          text/plain;charset=UTF-8:
            schema:
              type: object
              required: [session]
              properties:
                session: {type: string}
            example: {session: synthetic-session}
      responses:
        '200':
          description: Session ended.
    get:
      operationId: listWidgets
      summary: List widgets
      tags: [Widgets]
      responses:
        '200':
          description: A page of widgets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Widget'
components:
  schemas:
    Widget:
      type: object
      required: [id]
      properties:
        id:
          type: string
    WidgetSettings:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [draft, published]
      example:
        mode: draft
      x-example-evidence: synthetic
